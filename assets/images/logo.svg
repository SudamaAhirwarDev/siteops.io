<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <!-- Background Squircle Gradient for Icon -->
    <linearGradient id="logo-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Energy Stroke Gradient -->
    <linearGradient id="logo-energy-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#818CF8" />
      <stop offset="80%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Pulse Gradient -->
    <linearGradient id="logo-pulse-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#C7D2FE" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="logo-glow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Emblem Group (Left) -->
  <g transform="translate(6, 6)">
    <!-- Squircle Tile -->
    <rect width="48" height="48" rx="14" fill="url(#logo-bg-grad)" stroke="#6366F1" stroke-width="1.2" stroke-opacity="0.5" />
    <rect x="1" y="1" width="46" height="23" rx="13" fill="white" fill-opacity="0.08" />

    <!-- Shield Outline -->
    <path d="M24 8 L36 13 C36 22 31 30 24 34 C17 30 12 22 12 13 Z" 
          fill="none" 
          stroke="url(#logo-energy-grad)" 
          stroke-width="1.6" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          opacity="0.3" />

    <!-- Stylized Interlocking 'S' -->
    <path d="M31.5 16 C31.5 13 28 11.5 24 11.5 C18.5 11.5 15 14.5 15 19 C15 24.5 21 26 25 27.5 C29 29 33 31 33 35.5 C33 40.5 28.5 43.5 24 43.5 C18 43.5 14.5 40 14.5 36" 
          fill="none" 
          stroke="url(#logo-energy-grad)" 
          stroke-width="3.4" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#logo-glow)" />

    <!-- Lightning Pulse Center -->
    <path d="M26.5 19 L20.5 27.5 H27 L22.5 35" 
          fill="none" 
          stroke="url(#logo-pulse-grad)" 
          stroke-width="2.2" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Pulse Node -->
    <circle cx="35" cy="14" r="2.2" fill="#34D399" />
  </g>

  <!-- 2. Brand Wordmark Typography (Right) -->
  <g transform="translate(66, 0)">
    <!-- "SiteOps" Main Text -->
    <text x="0" y="34" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="24" letter-spacing="-0.5" fill="#FFFFFF">
      SiteOps
    </text>

    <!-- Accent Dot -->
    <circle cx="94" cy="31" r="3" fill="#38BDF8" />

    <!-- Badge: <15KB -->
    <rect x="104" y="19" width="52" height="18" rx="9" fill="#1E1B4B" stroke="#4F46E5" stroke-width="1" />
    <text x="130" y="32" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="9" fill="#818CF8" text-anchor="middle" letter-spacing="0.5">
      &lt;15KB
    </text>

    <!-- Subtitle -->
    <text x="1" y="48" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="600" font-size="9.5" letter-spacing="1.2" fill="#94A3B8" text-transform="uppercase">
      GROWTH &amp; CYBER SUITE
    </text>
  </g>
</svg>