<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" class="siteops-logo-icon">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="so-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Shield & S Energy Stroke Gradient -->
    <linearGradient id="so-energy-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#818CF8" />
      <stop offset="70%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Core Lightning Pulse Gradient -->
    <linearGradient id="so-pulse-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E0E7FF" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="so-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container / Shield Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#so-bg-grad)" stroke="#6366F1" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Inner Soft Bevel Highlight -->
  <rect x="3" y="3" width="58" height="28" rx="15" fill="white" fill-opacity="0.06" />

  <!-- Outer Protective Shield Perimeter (Security & Operations) -->
  <path d="M32 10 L48 16 C48 28 41 39 32 44 C23 39 16 28 16 16 Z" 
        fill="none" 
        stroke="url(#so-energy-grad)" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.35" />

  <!-- The Interlocking Dynamic "S" Emblem -->
  <!-- Top Loop of 'S' flowing from right to left, wrapping into center -->
  <path d="M42 20.5 C42 16.5 37.5 14 32 14 C24.5 14 20 18 20 23.5 C20 30.5 28 32.5 33 34 C38 35.5 44 38 44 44 C44 50.5 38.5 54 32 54 C24 54 19.5 49.5 19.5 44.5" 
        fill="none" 
        stroke="url(#so-energy-grad)" 
        stroke-width="4.2" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#so-glow)" />

  <!-- Core Operations Pulse: Sharp Central Lightning & Node (Speed, Alt-tags, SEO & Health) -->
  <path d="M35 24 L27 34.5 H35.5 L30 44" 
        fill="none" 
        stroke="url(#so-pulse-grad)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Live Pulse Diagnostic Indicator Dot (Top Right) -->
  <circle cx="46" cy="18" r="3" fill="#34D399" />
  <circle cx="46" cy="18" r="5" fill="#34D399" fill-opacity="0.35" />
</svg>